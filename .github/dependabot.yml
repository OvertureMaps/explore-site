---
version: 2
updates:

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "actions/*"
    open-pull-requests-limit: 5
    labels:
      - "bot"
    commit-message:
      prefix: "[CHORE](deps)"
      include: "scope"
    cooldown:
      default-days: 7

  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # @mui/material, @mui/icons-material, and @mui/x-tree-view are
      # peer-linked, so a major bump on one alone breaks resolution
      # (see #341). Group them so dependabot proposes major bumps as one
      # coordinated PR instead of piecemeal ones.
      mui:
        patterns:
          - "@mui/*"
      # eslint's major version is a peer dependency of eslint-config-next, and
      # eslint-config-next's major version tracks next's major version, so all
      # three must bump together or npm ci fails on a peer dependency conflict
      # (see #340).
      next-eslint-major:
        patterns:
          - "next"
          - "eslint"
          - "eslint-config-next"
        update-types:
          - "major"
      # react and react-dom must stay on the same major version, and a react
      # major also needs a next version whose peer range covers it (next 14
      # only supports react 18), so react ended up split across #350 and #354
      # with no matching next bump. Group react/react-dom major bumps so
      # dependabot proposes them together.
      react-major:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "major"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "bot"
    commit-message:
      prefix: "[CHORE](deps)"
      include: "scope"
    cooldown:
      default-days: 7
