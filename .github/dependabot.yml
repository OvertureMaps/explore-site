---
version: 2
updates:

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "actions/*"
    open-pull-requests-limit: 5
    labels:
      - "bot"
    commit-message:
      prefix: "[CHORE](deps)"
      include: "scope"
    cooldown:
      default-days: 7

  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # @mui/material, @mui/base, @mui/icons-material, and @mui/x-tree-view
      # are peer-linked, so a major bump on one alone breaks resolution
      # (see #341). Group them so dependabot proposes major bumps as one
      # coordinated PR instead of piecemeal ones.
      mui:
        patterns:
          - "@mui/*"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "bot"
    commit-message:
      prefix: "[CHORE](deps)"
      include: "scope"
    cooldown:
      default-days: 7
